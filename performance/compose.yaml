name: chaoxian-benchmark
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${BENCH_DB_PASSWORD}
      MYSQL_DATABASE: hmdp_benchmark
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:13306:3306"]
    command: ["--default-authentication-plugin=mysql_native_password", "--innodb-buffer-pool-size=128M"]
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:16379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
  namesrv:
    image: apache/rocketmq:4.9.6
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m -XX:-UseContainerSupport
    command: sh mqnamesrv
    ports: ["127.0.0.1:19876:9876"]
  broker:
    image: apache/rocketmq:4.9.6
    depends_on: [namesrv]
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn256m -XX:-UseContainerSupport
    command: sh mqbroker -n namesrv:9876 -c /home/rocketmq/broker.conf
    ports: ["127.0.0.1:10909:10909", "127.0.0.1:10911:10911", "127.0.0.1:10912:10912"]
    volumes: ["./broker.conf:/home/rocketmq/broker.conf:ro"]


