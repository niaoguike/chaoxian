name: JMeter benchmark
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCH_DB_PASSWORD: benchmark-only-isolated-db
      MYSQL_PASSWORD: benchmark-only-isolated-db
      MYSQL_PORT: '13306'
      MYSQL_CLI: mysql
      BENCH_USERS: '100000'
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:13306/hmdp_benchmark?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_REDIS_PORT: '16379'
      ROCKETMQ_NAMESERVER: 127.0.0.1:19876
      LOGGING_LEVEL_COM_HMDP: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Prepare real dependencies and JMeter
        working-directory: performance
        run: |
          export JWT_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          printf 'BENCH_DB_PASSWORD=%s\n' "$BENCH_DB_PASSWORD" > .env
          docker compose --env-file .env -f compose.yaml up -d
          command -v mysql || (sudo apt-get update && sudo apt-get install -y mysql-client)
          curl -fsSL https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz -o /tmp/jmeter.tgz
          curl -fsSL https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz.sha512 -o /tmp/jmeter.sha512
          python3 - <<'PY'
          import hashlib,re
          data=open('/tmp/jmeter.tgz','rb').read()
          expected=re.search(r'[a-fA-F0-9]{128}',open('/tmp/jmeter.sha512').read()).group().lower()
          assert hashlib.sha512(data).hexdigest()==expected
          PY
          tar -xzf /tmp/jmeter.tgz -C /tmp
          echo 'JMETER_HOME=/tmp/apache-jmeter-5.6.3' >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if MYSQL_PWD="$BENCH_DB_PASSWORD" mysql -h127.0.0.1 -P13306 -uroot -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker compose exec -T broker sh mqadmin updateTopic -n namesrv:9876 -b 127.0.0.1:10911 -t chaoxian-orders
          docker compose exec -T broker sh mqadmin updateTopic -n namesrv:9876 -b 127.0.0.1:10911 -t chaoxian-close
          python3 fixtures.py
      - name: Build and start application
        run: |
          mvn --batch-mode package
          nohup java -Xms128m -Xmx512m -XX:ActiveProcessorCount=2 -jar target/chaoxian-0.0.1-SNAPSHOT.jar --server.port=18081 > performance/app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -s http://127.0.0.1:18081/user/me -o /dev/null -w '%{http_code}' | grep -q 401; then exit 0; fi
            sleep 2
          done
          tail -100 performance/app.log
          exit 1
      - name: Measure actual HTTP requests and verify database
        working-directory: performance
        run: python3 run_benchmark.py
      - name: Capture container status and logs
        if: always()
        working-directory: performance
        run: |
          mkdir -p results
          docker compose ps -a > results/containers.txt
          docker compose logs --no-color --tail 100 > results/middleware.log
          cp app.log results/app.log 2>/dev/null || true
          cp -r "$HOME/logs/rocketmqlogs" results/client-logs 2>/dev/null || true
          docker compose exec -T broker sh -c 'tail -200 /home/rocketmq/logs/rocketmqlogs/broker.log' > results/broker-internal.log 2>&1 || true
          docker compose exec -T broker sh -c 'tail -100 /home/rocketmq/logs/rocketmqlogs/transaction.log; tail -100 /home/rocketmq/logs/rocketmqlogs/storeerror.log' > results/transaction.log 2>&1 || true
          lscpu > results/cpu.txt
          free -m > results/memory.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-evidence
          path: performance/results/
          retention-days: 30


